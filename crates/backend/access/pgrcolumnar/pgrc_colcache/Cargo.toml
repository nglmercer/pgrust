[package]
name = "pgrc_colcache"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
autotests = false

# C1 (pgrc-plans/C1.md): the process-wide images of the pgrcolumnar companion
# heaps (segments and the tombstone heap), kept current by pgrc_marks, and the
# per-statement views over them. Sits above pgrc_front; tableam depends on it
# (L4).
[dependencies]
pgrc_marks = { path = "../pgrc_marks" }
pgrc_am = { path = "../pgrc_am" }
pgrc_format = { path = "../pgrc_format" }
pgrc_front = { path = "../pgrc_front" }
pgrc_front_seams = { path = "../pgrc_front_seams" }
pgrc_scan = { path = "../pgrc_scan" }
# L5c: the residency plane's charges and ring; the builtins' heap scans and fmgr faces.
pgrc_read = { path = "../pgrc_read" }
datum = { path = "../../../../_support/types/datum" }
heapam = { path = "../../heap/heapam" }
tableam_vocab = { path = "../../table/tableam_vocab" }
types_fmgr = { path = "../../../../_support/types/fmgr" }
types_scan = { path = "../../../../_support/types/types_scan" }
mcx = { path = "../../../../_support/mcx" }
table = { path = "../../table/table" }
pgsync = { path = "../../../../_support/pgsync" }
bufmgr = { path = "../../../storage/buffer/bufmgr" }
procarray = { path = "../../../storage/ipc/procarray" }
snapmgr = { path = "../../../utils/time/snapmgr" }
transam_seams = { path = "../../transam/transam_seams" }
varsup = { path = "../../transam/varsup" }
xact = { path = "../../transam/xact" }
types_core = { path = "../../../../_support/types/types_core" }
types_error = { path = "../../../../_support/types/types_error" }
types_rel = { path = "../../../../_support/types/rel" }
types_snapshot = { path = "../../../../_support/types/snapshot" }
types_storage = { path = "../../../../_support/types/types_storage" }
types_tuple = { path = "../../../../_support/types/types_tuple" }

[dev-dependencies]
# K1 L6: tests/compacted_keying.rs builds compaction outputs with the real map builder.
pgrc_compact = { path = "../pgrc_compact" }
# C1 L5c: tests/view_key.rs publishes part-less generations (their StatsState) into the in-process catalog.
pgrc_write = { path = "../pgrc_write" }

# The integration tests (tests/*.rs). The files that can share one process are modules of ONE test binary, pgrc_colcache_suite
# (tests/pgrc_colcache_suite.rs: `#[path = "<stem>.rs"]` and `mod t_<stem>;` per file). A NEW test file goes there, unless it cannot
# share a process with the others (tests/registered.rs's rule: a #[global_allocator]; text naming process-wide or
# process-global state; a `pub static` that holds state; a call that sets or reads process-wide state): then it gets a
# [[test]] entry here, named <stem>. autotests = false, and tests/registered.rs fails until the file is in exactly one
# of the two places.
[[test]]
name = "pgrc_colcache_suite"
path = "tests/pgrc_colcache_suite.rs"

[[test]]
name = "admit_cap"
path = "tests/admit_cap.rs"

[[test]]
name = "budget"
path = "tests/budget.rs"

[[test]]
name = "settled_cap"
path = "tests/settled_cap.rs"

[[test]]
name = "settled_unmap"
path = "tests/settled_unmap.rs"
