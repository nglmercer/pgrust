[package]
name = "gravity_ir"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "gravity_ir"
path = "src/lib.rs"

[dependencies]
# P3 (plan-time memory): a program's vectors live in its own root context (mcx SendRoot), owned by the memory ledger's
# owner named at its birth (memledger Owner).
allocator-api2 = { workspace = true }
mcx = { path = "../../_support/mcx", features = ["std"] }
memledger = { path = "../../_support/memledger" }

[features]
# The text loader (text.rs: read_sexp, parse_program): test input only, out of the product build.
text-loader = []

# The integration tests are modules of ONE test binary, gravity_ir_suite. The text-loader modules carry an inner
# cfg(feature = "text-loader"), preserving the former required-features gate while leaving verify.rs ungated.
[[test]]
name = "gravity_ir_suite"
path = "tests/gravity_ir_suite.rs"
